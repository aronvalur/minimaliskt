<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimalískt — Vefsíðan í uppfærslu</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iI0ZGRjlGMCIvPjxjaXJjbGUgY3g9IjI0LjUiIGN5PSI4IiByPSIzLjQiIGZpbGw9IiNGRjRCMkUiLz48dGV4dCB4PSIxMy41IiB5PSIyNC41IiBmb250LWZhbWlseT0iR2VvcmdpYSwgJ1RpbWVzIE5ldyBSb21hbicsIHNlcmlmIiBmb250LXdlaWdodD0iOTAwIiBmb250LXNpemU9IjIxIiBmaWxsPSIjMTQxMTBEIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5NPC90ZXh0Pjwvc3ZnPg==">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,900;1,9..144,600&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

:root {
  --ink: #14110D;
  --paper: #FFF9F0;
  --paper-dim: #F3ECDD;
  --coral: #FF4B2E;
  --coral-ink: #C43A22;
  --line: rgba(20,17,13,0.12);
}

body {
  font-family: 'Bricolage Grotesque', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* subtle grain-free texture via layered radial glow */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 12%, rgba(255,75,46,0.10), transparent 40%),
    radial-gradient(circle at 88% 82%, rgba(255,75,46,0.08), transparent 45%);
  pointer-events: none;
  z-index: 0;
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding: 2.4rem 1.5rem 3rem;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  width: 100%;
}

/* header */
.top {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: auto;
}
.logo {
  display: flex; align-items: center; gap: 0.55rem;
  font-family: 'Fraunces', serif;
  font-size: 1.3rem; font-weight: 900;
  text-decoration: none; color: var(--ink);
}
.logo .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--coral); flex-shrink: 0;
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.35); opacity: 0.7; }
}
/* main content */
main {
  padding: 4.5rem 0 2.5rem;
  text-align: center;
}
.eyebrow {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--coral-ink); margin-bottom: 1.1rem;
}
h1 {
  font-family: 'Fraunces', serif;
  font-weight: 900;
  font-size: clamp(2.4rem, 7vw, 4.2rem);
  line-height: 1.02;
  letter-spacing: -0.02em;
  text-wrap: balance;
  margin-bottom: 1.3rem;
}
h1 em {
  font-style: italic;
  font-weight: 300;
  color: var(--coral-ink);
}
.lede {
  font-size: clamp(1rem, 2.4vw, 1.18rem);
  line-height: 1.6;
  color: rgba(20,17,13,0.72);
  max-width: 480px;
  margin: 0 auto 2.6rem;
  text-wrap: balance;
}

/* divider squiggle, echoes the live site's wave motif */
.squiggle { width: 100%; max-width: 320px; margin: 0 auto 2.6rem; }
.squiggle svg { display: block; width: 100%; height: 28px; }
.squiggle path {
  fill: none; stroke: var(--coral); stroke-width: 3; stroke-linecap: round;
  stroke-dasharray: 900; stroke-dashoffset: 900;
  animation: draw 2.4s ease-out forwards 0.3s;
}
@keyframes draw { to { stroke-dashoffset: 0; } }

/* contact */
.contact-block {
  display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
}
.contact-note {
  font-size: 0.85rem;
  color: rgba(20,17,13,0.55);
}
.email-link {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-style: italic;
  font-size: clamp(1.15rem, 3vw, 1.4rem);
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1.5px solid var(--coral);
  padding-bottom: 0.1rem;
  transition: color 0.2s ease, border-color 0.2s ease;
}
.email-link:hover { color: var(--coral-ink); border-color: var(--coral-ink); }

/* footer */
footer {
  text-align: center;
  padding-top: 2rem;
  border-top: 1px solid var(--line);
  font-size: 0.78rem;
  color: rgba(20,17,13,0.5);
  display: flex; flex-direction: column; gap: 0.35rem;
}
footer strong { color: rgba(20,17,13,0.7); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  .logo .dot { animation: none; }
  .squiggle path { animation: none; stroke-dashoffset: 0; }
}

</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <a href="#" class="logo"><span class="dot"></span>Minimalískt</a>
  </div>

  <main>
    <div class="eyebrow">Gervigreind &amp; sjálfvirkni fyrir fyrirtæki</div>
    <h1>Við erum að <em>laga</em><br>vefsíðuna okkar.</h1>
    <p class="lede">
      Nýja vefsíðan er á leiðinni og kemur fljótlega. Á meðan má alltaf ná í okkur beint.
    </p>

    <div class="squiggle">
      <svg viewBox="0 0 320 28" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,14 C 20,2 40,26 60,14 C 80,2 100,26 120,14 C 140,2 160,26 180,14 C 200,2 220,26 240,14 C 260,2 280,26 300,14 C 308,10 314,18 320,14" />
      </svg>
    </div>

    <div class="contact-block">
      <div class="contact-note">Hafðu samband</div>
      <a class="email-link" href="mailto:aron@minimaliskt.is">aron@minimaliskt.is</a>
    </div>
  </main>

  <footer>
    <div><strong>Minimalískt</strong> — Reykjavík</div>
    <div>Gervigreind &amp; sjálfvirkni fyrir fyrirtæki</div>
  </footer>

</div>
</body>
</html>
